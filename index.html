
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VINYL — Music Player</title>

    <!-- p5.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.0.0/p5.js"></script>

    <!-- ml5.js / PoseNet -->
    <script src="https://unpkg.com/ml5@0.4.3/dist/ml5.min.js"></script>

    <!-- p5 Sound -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.1/addons/p5.sound.min.js"></script>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="player">

        <!-- HEADER -->
        <header class="top-bar">
            <h1>VINYL<span>.</span></h1>
            <p>YOUR PERSONAL MUSIC SPACE</p>
        </header>

        <!-- TURNTABLE -->
        <section class="turntable">

            <div class="record-area" id="recordArea">

                <div class="vinyl" id="vinyl">

                    <div class="vinyl-label">
                        <span>VINYL</span>
                        <small>ORIGINAL RECORD</small>
                    </div>

                </div>

            </div>

            <div class="tonearm" id="tonearm"></div>

        </section>

        <!-- TRACK INFORMATION -->
        <section class="track-info">

            <p class="eyebrow">NOW PLAYING</p>

            <h2 id="songTitle">Ghungroo</h2>

            <p id="artistName">War Soundtrack</p>

        </section>

        <!-- MUSIC CONTROLS -->
        <section class="controls">

            <button id="previousBtn" aria-label="Previous song">
                |◀
            </button>

            <button id="playBtn" aria-label="Play or pause">
                ▶
            </button>

            <button id="nextBtn" aria-label="Next song">
                ▶|
            </button>

        </section>

        <!-- VOLUME -->
        <section class="volume-control">

            <span>VOLUME</span>

            <input
                type="range"
                id="volumeSlider"
                min="0"
                max="100"
                value="70"
            >

        </section>

        <!-- GESTURE MODE STATUS -->
        <section class="gesture-status" id="gestureStatus">

            <span class="status-indicator" id="statusIndicator"></span>

            <span id="gestureText">GESTURE MODE OFF</span>

        </section>

        <!-- GESTURE MODE TOGGLE -->
        <button id="gestureToggleBtn" class="gesture-toggle">
            ENABLE GESTURE MODE
        </button>

        <footer>
            <p>DRAG • SPIN • LISTEN</p>
        </footer>

    </main>

    <!-- WEBCAM PREVIEW -->
    <aside class="camera-panel" id="cameraPanel">

        <div class="camera-header">
            <span>GESTURE CAMERA</span>
            <span class="camera-dot"></span>
        </div>

        <div class="camera-feed" id="cameraFeed">

            <div class="camera-placeholder" id="cameraPlaceholder">
                <span>CAMERA INACTIVE</span>
                <small>Enable gesture mode to activate</small>
            </div>

        </div>

        <div class="camera-footer">
            <span id="cameraState">WAITING FOR GESTURE</span>
        </div>

    </aside>

    <!-- APPLICATION LOGIC -->
    <script src="main.js"></script>

</body>

</html>
